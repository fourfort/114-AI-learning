<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>人工智慧數據分析系統</title>
    <style>
        body { font-family: Arial; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 200px; background: #f0f0f0; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .main { flex: 1; padding: 20px; }
        .btn { display: block; width: 100%; margin-bottom: 10px; padding: 10px; background: #007BFF; color: white; border: none; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        #output { width: 100%; height: 90%; white-space: pre-wrap; background: #eee; padding: 10px; overflow-y: auto; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="sidebar">
        <input type="file" id="fileInput" style="margin-bottom: 10px;">
        <button class="btn" onclick="uploadFile()">分析檔案上傳（Excel）</button>
        <button class="btn" onclick="analyze()">數據分析（決策樹）</button>
    </div>
    <div class="main">
        <div id="output">請先上傳 Excel 檔案並執行分析</div>
    </div>

    <script>
        let uploadedFilename = '';

        function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            }).then(res => res.json())
              .then(data => {
                  if (data.status === 'success') {
                      uploadedFilename = data.filename;
                      document.getElementById('output').textContent = `上傳成功：${data.filename}`;
                  } else {
                      document.getElementById('output').textContent = `錯誤：${data.message}`;
                  }
              });
        }

        function analyze() {
            if (!uploadedFilename) {
                document.getElementById('output').textContent = "請先上傳 Excel 檔案！";
                return;
            }
            fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: uploadedFilename })
            }).then(res => res.json())
              .then(data => {
                  if (data.status === 'success') {
                      document.getElementById('output').textContent = data.result;
                  } else {
                      document.getElementById('output').textContent = `錯誤：${data.message}`;
                  }
              });
        }
    </script>
</body>
</html>
